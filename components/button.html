<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buttons | JCC component</title>
  <link rel="icon" href="../logos/favicon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../css/jcc.css">
</head>
<body>
<!-- Buttons: Primary = blue (default action). Outline = secondary. Accent orange = one "Learn More" per view, navy text. Ghost-light on dark/photo only. -->
 <div class="jcc-section"><div class="jcc-container">
  <a class="jcc-btn jcc-btn--primary" href="#">Schedule a Conversation</a>
  <a class="jcc-btn jcc-btn--outline" href="#">Meet the Team</a>
  <a class="jcc-btn jcc-btn--accent" href="#">Learn More</a>
  <button class="jcc-btn jcc-btn--primary" type="button">Button element</button>
 </div></div>
 <div class="jcc-section jcc-section--dark"><div class="jcc-container">
  <a class="jcc-btn jcc-btn--accent" href="#">Learn More</a>
  <a class="jcc-btn jcc-btn--ghost-light" href="#">Contact Us</a>
 </div></div>
</body>
</html>
