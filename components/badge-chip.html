<!-- Badge and chip: Chip = pill, tinted (orange-wash/#9A560C or blue-wash/blue-deep) for topics. Badge = 4px radius, solid for status. -->
 <div class="jcc-section"><div class="jcc-container">
  <p><span class="jcc-chip">Service</span> <span class="jcc-chip jcc-chip--blue">Planning</span></p>
  <p><span class="jcc-badge">New</span> <span class="jcc-badge jcc-badge--navy">Updated</span> <span class="jcc-badge jcc-badge--outline">Guide</span></p>
 </div></div>
</body>
