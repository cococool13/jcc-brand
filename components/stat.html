<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stat / figure | JCC component</title>
  <link rel="icon" href="../logos/favicon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../css/jcc.css">
</head>
<body>
<!-- Stat / figure: Big slab-serif number in brand blue over a 3px blue rule; label in gray-9. On dark: white number, orange rule. -->
 <div class="jcc-section"><div class="jcc-container"><div class="jcc-grid">
  <div class="jcc-stat"><div class="jcc-stat__value">1962</div><div class="jcc-stat__label">Serving clients since</div></div>
  <div class="jcc-stat"><div class="jcc-stat__value">65+</div><div class="jcc-stat__label">Years of collective expertise</div></div>
  <div class="jcc-stat"><div class="jcc-stat__value">1:1</div><div class="jcc-stat__label">Annual review with every client</div></div>
 </div></div></div>
 <div class="jcc-section jcc-section--dark"><div class="jcc-container"><div class="jcc-grid">
  <div class="jcc-stat"><div class="jcc-stat__value">1962</div><div class="jcc-stat__label">Serving clients since</div></div>
  <div class="jcc-stat"><div class="jcc-stat__value">65+</div><div class="jcc-stat__label">Years of collective expertise</div></div>
 </div></div></div>
</body>
</html>
